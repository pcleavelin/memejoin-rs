[package]
name = "memejoin-rs"
version = "0.3.1-alpha"
edition = "2024"

[[bin]]
name = "memejoin-rs"
path = "src/main.rs"

[lib]
name = "memejoin_rs"
path = "src/lib/mod.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.72"
axum = { version = "0.6.9", features = ["headers", "multipart"] }
axum-extra = { version = "0.7.5", features = ["cookie-private", "cookie"] }
chrono = { version = "0.4.23", features = ["serde"] }
dotenv = "0.15.0"
enum-iterator = "1.4.1"
futures = "0.3.26"
iter_tools = "0.1.4"
reqwest = { version = "0.11.14", features = ["json"] }
serde = "1.0.152"
serde_json = "1.0.93"
thiserror = "1.0.38"
tokio = { version = "1.25.0", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.4.0", features = ["cors"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
uuid = { version = "1.3.0", features = ["v4"] }

[dependencies.serenity]
version = "0.12.4"
default-features = false
features = ["client", "gateway", "rustls_backend", "model", "cache", "voice"]

[dependencies.songbird]
version = "0.5.0"
features = [ "builtin-queue", "driver" ]

[dependencies.symphonia]
version = "0.5.5"
features = [ "all" ]

[target.'cfg(unix)'.dependencies]
rusqlite = { version = "0.29.0", features = ["chrono"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.29.0", features = ["bundled", "chrono"] }

[lints.clippy]
map_flatten = "allow"
